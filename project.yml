name: KidsLearnTV
options:
  bundleIdPrefix: edu.sliit.se4041
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TVOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '3'
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KidsLearnTV:
    type: application
    platform: tvOS
    deploymentTarget: '17.0'
    sources:
      - path: KidsLearnTV
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.sliit.se4041.KidsLearnTV
        INFOPLIST_FILE: KidsLearnTV/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KidsLearnTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: '17.0'
    sources:
      - path: KidsLearnTVTests
    dependencies:
      - target: KidsLearnTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.sliit.se4041.KidsLearnTVTests
        GENERATE_INFOPLIST_FILE: YES
  KidsLearnTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: '17.0'
    sources:
      - path: KidsLearnTVUITests
    dependencies:
      - target: KidsLearnTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.sliit.se4041.KidsLearnTVUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KidsLearnTV:
    build:
      targets:
        KidsLearnTV: all
    run:
      config: Debug
    test:
      targets:
        - KidsLearnTVTests
        - KidsLearnTVUITests
